<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Очистити місяць</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #667eea; }
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 5px;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-success {
            background: #10b981;
            color: white;
        }
        .warning {
            background: #fef3c7;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #f59e0b;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗑️ Очистити Лютий 2026</h1>
        
        <div class="warning">
            <strong>⚠️ Попередження</strong><br>
            Лютий містить копію даних Січня.<br>
            Ця дія видалить дані лютого з LocalStorage і Firebase.<br><br>
            <strong>Після цього потрібно буде заново ввести дані лютого вручну.</strong>
        </div>
        
        <div style="text-align: center; margin-top: 30px;">
            <button class="btn btn-danger" onclick="clearFebruary()">🗑️ Очистити Лютий</button>
            <button class="btn btn-success" onclick="window.location.href='index.html'">❌ Скасувати</button>
        </div>
        
        <div id="status" style="margin-top: 20px; text-align: center;"></div>
    </div>
    
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, remove } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
        
        const app = initializeApp({
            apiKey: "AIzaSyBjusHy-xqg8FA8LjsGHK8DJFm4eJppDHM",
            authDomain: "work-time-a7236.firebaseapp.com",
            databaseURL: "https://work-time-a7236-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "work-time-a7236",
            storageBucket: "work-time-a7236.firebasestorage.app",
            messagingSenderId: "68175538100",
            appId: "1:68175538100:web:bdb96fe020af7c3e59f4e1"
        });
        
        const database = getDatabase(app);
        window.firebaseDB = database;
        window.firebaseRef = ref;
        window.firebaseRemove = remove;
    </script>
    
    <script>
        async function clearFebruary() {
            if (!confirm('ВИ ВПЕВНЕНІ?\n\nЦе видалить ВСІ дані лютого 2026!\nЦю дію НЕ МОЖНА відмінити!')) {
                return;
            }
            
            const status = document.getElementById('status');
            status.innerHTML = '<p style="color: #f59e0b;">Очищення...</p>';
            
            try {
                // Видаляємо з LocalStorage
                localStorage.removeItem('timeTracking_2026_02');
                localStorage.removeItem('timeTracking_2026_02_minHours');
                
                // Видаляємо з Firebase
                const febRef = window.firebaseRef(window.firebaseDB, 'timeTracking/2026/1');
                await window.firebaseRemove(febRef);
                
                status.innerHTML = '<p style="color: #10b981; font-weight: bold;">✓ Лютий очищено!</p><p>Тепер відкрийте index.html і введіть дані заново.</p>';
                
                setTimeout(() => {
                    if (confirm('Відкрити головну сторінку?')) {
                        window.location.href = 'index.html';
                    }
                }, 2000);
                
            } catch (error) {
                status.innerHTML = '<p style="color: #ef4444;">❌ Помилка: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
